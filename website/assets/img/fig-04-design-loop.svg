<svg viewBox="0 0 680 186" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" style="max-width:680px;height:auto;display:block">
<title>Design loop for transmembrane constructs</title>
<desc>Four steps: design a host-matched construct, predict solubility, test a 24 to 96 condition matrix, then feed every result including failures into the next design.</desc>
<defs>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="22" font-size="13" font-weight="500" fill="#081729">The construct is designed, not defaulted</text>

<rect x="40" y="40" width="128" height="64" rx="8" fill="#eef3fa" stroke="#2a4299" stroke-width="0.5"/>
<text x="104" y="62" font-size="13" font-weight="500" fill="#081729" text-anchor="middle" dominant-baseline="central">Design</text>
<text x="104" y="84" font-size="11" fill="#5b6c86" text-anchor="middle" dominant-baseline="central">Host-matched</text>

<rect x="196" y="40" width="128" height="64" rx="8" fill="#eef3fa" stroke="#2a4299" stroke-width="0.5"/>
<text x="260" y="62" font-size="13" font-weight="500" fill="#081729" text-anchor="middle" dominant-baseline="central">Predict</text>
<text x="260" y="84" font-size="11" fill="#5b6c86" text-anchor="middle" dominant-baseline="central">Solubility ranked</text>

<rect x="352" y="40" width="128" height="64" rx="8" fill="#eef3fa" stroke="#2a4299" stroke-width="0.5"/>
<text x="416" y="62" font-size="13" font-weight="500" fill="#081729" text-anchor="middle" dominant-baseline="central">Test</text>
<text x="416" y="84" font-size="11" fill="#5b6c86" text-anchor="middle" dominant-baseline="central">24–96 conditions</text>

<rect x="508" y="40" width="128" height="64" rx="8" fill="#eef3fa" stroke="#2a4299" stroke-width="0.5"/>
<text x="572" y="62" font-size="13" font-weight="500" fill="#081729" text-anchor="middle" dominant-baseline="central">Learn</text>
<text x="572" y="84" font-size="11" fill="#5b6c86" text-anchor="middle" dominant-baseline="central">Failures reused</text>

<path d="M168 72L192 72" fill="none" stroke="#2f8fd0" stroke-width="1" marker-end="url(#ar4)"/>
<path d="M324 72L348 72" fill="none" stroke="#2f8fd0" stroke-width="1" marker-end="url(#ar4)"/>
<path d="M480 72L504 72" fill="none" stroke="#2f8fd0" stroke-width="1" marker-end="url(#ar4)"/>

<path d="M572 104V146H104V108" fill="none" stroke="#2f8fd0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar4)"/>
<text x="338" y="164" font-size="11" fill="#8394ab" text-anchor="middle">Every result, including failures, becomes the input for the next design</text>
</svg>
