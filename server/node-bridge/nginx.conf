# Aliyun test host: HTTPS on 8443 (self-signed), plain 80 redirects to it.
# Mirrors /etc/nginx/sites-available/tl.conf on 47.93.183.103.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/tl.crt;
    ssl_certificate_key /etc/ssl/private/tl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;

    root /var/www/tl;
    index index.html;
    charset utf-8;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # long-lived assets
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2|woff|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # editor: never indexed
    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # API runs as a local Node process (server/worker.js unchanged)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # CMS login bridge: same origin, so /admin never touches workers.dev.
    # $http_host (not $host) keeps :8443 in the OAuth redirect_uri.
    location /oauth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # Cookie-free pageview analytics, admin UI and the counting endpoint.
    # The trailing slash strips /stats before proxying: goatcounter runs with
    # -base-path /stats and re-adds the prefix itself (otherwise it loops 307).
    location /stats/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # plain HTTP that reaches the TLS port: bounce to https
    error_page 497 https://$host:$server_port$request_uri;
    error_page 404 /404.html;
}
