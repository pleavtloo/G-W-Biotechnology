name: build-and-check

# Rebuilds the site from content/*.yaml on every push, then runs the same gate a
# developer runs locally. No deploy step yet: publishing needs CF_API_TOKEN and a
# Pages project (see RESUME.md).
#
# build_docs.py is intentionally NOT run here: it hardcodes FONT_DIR = C:/Windows/Fonts,
# so the 90 PDFs are only regenerated on a Windows machine (or after that script is
# made cross-platform). The PDFs themselves are committed under website/docs/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyyaml fpdf2

      - name: Build pages
        run: python tools/build_site.py

      - name: Build dist
        run: python tools/build_dist.py

      - name: Quality gate
        run: python tools/check.py

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
