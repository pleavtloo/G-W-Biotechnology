faq:
- question: Are your products available at GMP grade?
  answer: Yes. The majority of the bead, antibody and cytokine portfolio is available in GMP grade manufactured
    under ISO 13485 and ISO 9001 quality systems, with batch-specific documentation. RUO-grade equivalents are available
    for earlier research stages so that you can qualify the same reagent early.
- question: What does the FDA DMF cover?
  answer: 'Two Type II Drug Master Files are on record: DMF 038124 for the ActSep® CD3/CD28 separation and activation
    beads, and DMF 038820 for the anti-human CD28 monoclonal antibody. A DMF allows a sponsor to reference our manufacturing
    information without receiving it directly. Letter of authorisation requests are handled by our regulatory team.'
- question: Can you support a customer audit?
  answer: We have supported audit data packages for more than 30 customers, and our quality team routinely hosts
    on-site and remote audits of the 3,200 m² R&D and GMP facility. Contact us to schedule an audit or request the
    standard audit package.
- question: How do I find the COA for a specific lot?
  answer: Enter the lot number in the COA lookup on our Resources page. If the certificate is not yet indexed, email
    info@tlbiotechnology.com with the lot number and product name and we will send it within one business day.
- question: Do you ship internationally?
  answer: Yes. Orders ship from our US distribution point in Carlsbad, California and from our manufacturing site,
    with cold-chain packaging validated for the destination. Lead times depend on grade and pack size; quote requests
    include an estimated ship date.
- question: Can we get a sample before committing to a GMP lot?
  answer: Yes. Evaluation samples are available for most catalogue items at RUO grade, and we can discuss a qualification
    package for GMP-grade material under a technical agreement.
