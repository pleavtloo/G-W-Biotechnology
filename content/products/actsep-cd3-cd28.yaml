blurb: Single-reagent isolation and activation of human CD3⁺ T cells.
desc: ActSep® beads combine anti-human CD3 and CD28 antibodies on a magnetic core, allowing CD3⁺ T cells
  to be isolated from PBMC or leukopaks and activated in the same step. The bead-to-cell ratio can be
  titrated for either a research-scale expansion or a closed, clinical manufacturing process.
highlights:
