blurb: 15 mL sample in a 50 mL outer tube, five cut-offs from 3 to 100 kD.
desc: 'Ultrafiltration centrifugal devices concentrate and desalt biological samples in a single spin,
  without the sample loss that comes with precipitation or dialysis. The vertical membrane design and
  glue-free construction keep dead volume low, so recovery stays above 90% across the full 3-100 kD range.


  Sample is loaded into the inner tube and spun; buffer and small molecules pass the modified PES membrane
  while proteins, nucleic acids and particles above the cut-off are retained. For buffer exchange, add
  diluent and repeat the spin.


  Every tube is pressure tested for 100% airtightness and holds retention above 96% after twenty cycles,
  including 24-hour immersion in 1 M NaOH or 1 M HCl.'
highlights:
- Recovery above 90%, retention above 96% after 20 cycles
- 'Glue-free construction: 100% airtight, no protein leakage'
- 'Acid and alkali resistant: 1 M NaOH or HCl for 24 hours'
