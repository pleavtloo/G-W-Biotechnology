blurb: 0.5 mL sample, two 2 mL outer tubes, supports reverse centrifugation.
desc: 'The smallest format in the range, built for samples of a few hundred microlitres where every microlitre
  counts. Each box contains two 2 mL outer tubes so one inner cup can be spun in the normal orientation
  and the other used for reverse centrifugation to pull the concentrate back off the membrane.


  Retention exceeds 96% and recovery exceeds 88% across all five cut-offs, matching the larger formats
  on the same test protocol.


  Suited to concentrating immunoprecipitates, cleaning up low-yield nucleic acid preps, and exchanging
  buffer before mass spectrometry.'
highlights:
- Reverse centrifugation supported by the second outer tube
- Recovery above 88% with only 0.5 mL of sample
- Supplied as 24 pcs/box with 48 outer tubes
