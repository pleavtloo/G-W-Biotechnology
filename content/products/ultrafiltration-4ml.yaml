blurb: 4 mL sample in a 15 mL outer tube, five cut-offs from 3 to 100 kD.
desc: 'The 4 mL format concentrates and desalts small sample volumes in a standard 15 mL swinging-bucket
  or fixed-angle rotor. Load, spin, and recover the concentrate from the inner cup without pipetting against
  a membrane.


  Retention stays above 96% and recovery above 88% across the 3-100 kD range, and the device can be reused
  after rinsing, holding performance through twenty cycles.


  Typical uses are concentrating eluted antibodies, exchanging buffers before labelling, and cleaning
  up PCR or enzymatic reactions.'
highlights:
- Fits standard 15 mL rotors
- Recovery above 88%, retention above 96%
- Reusable 20+ times after rinsing
