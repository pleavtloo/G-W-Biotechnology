blurb: Pre-cut sheets or roll, for routine western blots with faster wetting.
desc: 'The 0.45 um grade is the workhorse for routine western blotting. Larger pores wet out faster and
  drain more freely, which shortens transfer time for standard proteins in the 20-100 kD range.


  Like the 0.22 um grade it needs methanol activation, works with chemiluminescence and conventional stains,
  and survives stripping for reprobing.


  Supplied as pre-cut sheets (8.5 x 7.5 cm, 150 per box) or a 27 cm x 4 m roll.'
highlights:
- Faster wetting and transfer for routine blots
- Lower cost per blot than the 0.22 um grade
- Same stripping and staining compatibility
